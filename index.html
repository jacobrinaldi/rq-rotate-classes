<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=750px, height=750px, initial-scale=1.0">
  <title>Classes</title>
  <script src="index.js" defer></script> <!-- Added "defer" to make sure JS loads safely after HTML -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- FIXED: Added leading zeros to early morning hours -->
<div class="History" data-start="08:00" data-end="08:52">
  <h2>History</h2>
  <h3>8:00-8:52</h3>
</div>
<div class="Science" data-start="08:55" data-end="09:56">
  <h2>Science</h2>
  <h3>8:55-9:56</h3>
</div>
<div class="Band_Gym" data-start="09:51" data-end="10:42"> <!-- Removed slash from class name to fix CSS targeting -->
  <h2>Band / Gym</h2>
  <h3>9:51-10:42</h3>
</div>
<div class="Peer_Leadership" data-start="10:45" data-end="11:47">
  <h2>Peer Leadership</h2>
  <h3>10:45-11:47</h3>
</div>
<div class="Lunch" data-start="11:49" data-end="12:19">
  <h2>Lunch</h2>
  <h3>11:49-12:19</h3>
</div>
<div class="Algebra_2" data-start="12:22" data-end="13:13">
  <h2>Algebra 2</h2>
  <h3>12:22-1:13</h3>
</div>
<div class="Honors_ELA" data-start="13:15" data-end="14:06">
  <h2>Honors ELA</h2>
  <h3>1:15-2:06</h3>
</div>
<div class="Bulldog_Block" data-start="14:09" data-end="15:00">
  <h2>Bulldog Block</h2>
  <h3>2:09-3:00</h3>
</div>
<div class="Bus" data-start="15:03" data-end="15:30">
  <h2>Bus</h2>
  <h3>3:03-3:30</h3>
</div>
<div class="home" data-start="15:30" data-end="07:45"> <!-- FIXED: Added leading zero to 07:45 -->
  <h2>Home</h2>
  <h3>3:30-7:45</h3>
</div>

<!-- Fallback message for gaps or weekends -->
<div id="no-class-message" class="hidden">
  <h2>Free Time</h2>
  <h3>No scheduled block right now</h3>
</div>
</body>
</html>
